services:
  cloud-server:
    build:
      context: .
      dockerfile: ./apps/cloud-server/Dockerfile
    container_name: caption-cloud-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3-turbo}
      - ROMANIZE_MODEL=${ROMANIZE_MODEL:-openai/gpt-oss-20b}
    tmpfs:
      - /tmp

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: caption-whisper
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=${ASR_MODEL:-base}
      - ASR_ENGINE=${ASR_ENGINE:-faster_whisper}
    volumes:
      - whisper-cache:/root/.cache
    profiles:
      - local

  local-server:
    build:
      context: .
      dockerfile: ./apps/local-server/Dockerfile
    container_name: caption-local-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:1.5b}
      - LOCAL_WHISPER_API_URL=http://whisper:9000
      - LOCAL_WHISPER_LANGUAGE=${LOCAL_WHISPER_LANGUAGE:-hi}
    depends_on:
      - whisper
    tmpfs:
      - /tmp
    profiles:
      - local

volumes:
  whisper-cache:
