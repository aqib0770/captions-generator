name: caption-test

services:
  whisper:
    build:
      context: ./docker/whisper
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
      - whisper-models:/root/.cache/huggingface
    environment:
      - WHISPER_MODEL=large
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8

  formatter:
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    network_mode: "host"
    volumes:
      - ./data:/data
    environment:
      - TRANSLITERATION_SERVICE_URL=${TRANSLITERATION_SERVICE_URL:-http://localhost:5000/transliterate}

  ffmpeg:
    image: linuxserver/ffmpeg:latest
    volumes:
      - ./data:/data

volumes:
  whisper-models:
    name: caption-test_whisper-models
