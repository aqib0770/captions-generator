services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: caption-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3-turbo}
    tmpfs:
      - /tmp
